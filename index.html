<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- QA-2: inline SVG favicon — a present rel=icon suppresses the browser's default /favicon.ico request, clearing the console 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f7cff'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='18' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"/>
<title>Agency CRM — Dashboard · Contacts · Companies · Pipeline · Deals · Activities</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --panel2:#1d2530; --line:#2a323f;
    --txt:#e6edf3; --muted:#8b97a7; --faint:#5b6573; --accent:#4f7cff; --accent2:#6c5ce7;
    --green:#2ecc71; --ok:#2ecc71; --red:#ff5c5c; --amber:#f5a623; --chip:#222b38;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  a{color:var(--accent)}
  .app{display:flex;min-height:100vh}
  .side{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
  .brand{font-weight:700;font-size:17px;padding:6px 10px 14px;letter-spacing:.3px}
  .brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:3px}
  .nav{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;color:var(--muted);cursor:pointer;text-decoration:none;font-weight:600}
  .nav .ic{width:18px;text-align:center}
  .nav:hover{background:var(--panel2);color:var(--txt)}
  .nav.active{background:var(--accent);color:#fff}
  .nav .c{margin-left:auto;background:rgba(255,255,255,.15);border-radius:20px;padding:0 8px;font-size:11px;font-weight:700}
  .side .sep{height:1px;background:var(--line);margin:8px 4px}
  .ownerbox{padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;font-size:12px}
  .ownerbox label{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .btn{background:var(--accent);color:#fff;border:0;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
  .btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{background:var(--red)}
  /* topbar */
  .body{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
  .topsearch{flex:1;max-width:460px;position:relative}
  .topsearch input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:9px;font-size:13px}
  .results{position:absolute;top:44px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 44px rgba(0,0,0,.5);overflow:hidden;z-index:40}
  .results .r{padding:9px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;border-bottom:1px solid var(--line)}
  .results .r:last-child{border-bottom:0}
  .results .r:hover{background:var(--panel2)}
  .results .k{font-size:10px;text-transform:uppercase;color:var(--faint);margin-left:auto}
  .main{flex:1;padding:24px 28px;max-width:1640px;width:100%}
  .menu{position:relative;display:inline-block}
  .menu .pop{position:absolute;right:0;top:40px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 44px rgba(0,0,0,.5);min-width:180px;overflow:hidden;z-index:40;display:none}
  .menu.open .pop{display:block}
  .menu .pop a{display:block;padding:9px 14px;color:var(--txt);font-size:13px;border-bottom:1px solid var(--line);cursor:pointer}
  .menu .pop a:last-child{border-bottom:0}
  .menu .pop a:hover{background:var(--panel2)}
  /* generic */
  h1{font-size:23px;margin:0 0 3px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:13px}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .card .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .card .meta{color:var(--muted);font-size:12px;margin-top:6px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:var(--panel2)}
  tr:last-child td{border-bottom:0}
  tfoot td{font-weight:700;background:var(--panel2);border-top:2px solid var(--line);border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.green{background:rgba(46,204,113,.15);color:var(--green)}
  .pill.red{background:rgba(255,92,92,.15);color:var(--red)}
  .pill.amber{background:rgba(245,166,35,.15);color:var(--amber)}
  .pill.blue{background:rgba(79,124,255,.15);color:var(--accent)}
  .pill.violet{background:rgba(108,92,231,.18);color:#a99bf0}
  .pill.grey{background:var(--chip);color:var(--muted)}
  .muted{color:var(--muted)}
  .warn{color:var(--amber);font-weight:600}
  .bar{height:7px;background:var(--panel2);border-radius:20px;overflow:hidden;min-width:90px}
  .bar > i{display:block;height:100%;background:var(--accent)}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 10px;border-radius:8px;font-size:13px;width:100%;font-family:inherit}
  input[type=checkbox]{width:auto}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:600px;max-width:100%}
  .modal h2{margin:0 0 16px;font-size:18px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .fgrid .full{grid-column:1/3}
  .tag{font-size:11px;background:var(--chip);color:var(--muted);padding:2px 8px;border-radius:6px;display:inline-block;margin:1px 2px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 9px 2px 3px;font-size:12px}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  .iconbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px}
  .iconbtn:hover{color:var(--txt)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .search{max-width:280px}
  .av{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .nudge{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0}
  /* kanban */
  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:240px;flex:1;display:flex;flex-direction:column}
  .col-h{padding:11px 13px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .col-h .sum{color:var(--muted);font-size:11px;font-weight:600}
  .col-b{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px;flex:1}
  .col-b.drag{outline:2px dashed var(--accent);outline-offset:-6px;border-radius:10px}
  .deal{background:var(--panel2);border:1px solid var(--line);border-left:3px solid transparent;border-radius:10px;padding:11px;cursor:grab}
  .deal:active{cursor:grabbing}
  .deal.stalled{border-left-color:var(--amber)}
  .deal .t{font-weight:700;font-size:13px;margin-bottom:4px}
  .deal .m{color:var(--muted);font-size:11px}
  .deal .v{font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px}
  .feed{display:flex;flex-direction:column;gap:0}
  .fi{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .fi:last-child{border-bottom:0}
  .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--panel2)}
  /* toast */
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);background:#222c3a;border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.5);display:flex;align-items:center;gap:14px;z-index:90;transition:transform .22s ease;font-size:13px}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px}
  /* auth */
  .authwrap{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
  .authcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px 32px;width:340px;max-width:100%;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .authcard h1{font-size:19px;margin:0 0 4px}
  .authcard p.sub{font-size:13px;margin:0 0 20px}
  .autherr{color:var(--red);font-size:13px;margin:0 0 12px;display:none}
  /* QA-1: hamburger + off-canvas mobile nav */
  .hamburger{display:none;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:18px;line-height:1;padding:7px 11px;border-radius:9px;cursor:pointer}
  .navbackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  /* tablet: collapse sidebar to an icon rail (above the mobile drawer breakpoint) */
  @media(min-width:701px) and (max-width:980px){ .twocol{grid-template-columns:1fr} .side{width:60px} .brand small,.nav span:not(.ic):not(.c),.ownerbox,.side .foot .btn{display:none} }
  /* phone: sidebar becomes an off-canvas drawer toggled by the hamburger */
  @media(max-width:700px){
    .twocol{grid-template-columns:1fr}
    .hamburger{display:inline-flex;align-items:center;justify-content:center}
    .side{position:fixed;left:0;top:0;height:100vh;width:248px;max-width:84vw;z-index:40;transform:translateX(-100%);transition:transform .22s ease;overflow-y:auto}
    .app.navopen .side{transform:translateX(0);box-shadow:0 0 44px rgba(0,0,0,.6)}
    .app.navopen .navbackdrop{display:block}
    .main{padding:18px 16px}
    .topbar{padding:12px 14px}
  }
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand">Agency CRM<small>Internal sales suite</small></div>
    <div class="nav" data-view="dashboard"><span class="ic">▦</span><span>Dashboard</span></div>
    <div class="nav" data-view="contacts"><span class="ic">👤</span><span>Contacts</span><span class="c" id="c-contacts"></span></div>
    <div class="nav" data-view="companies"><span class="ic">🏢</span><span>Companies</span><span class="c" id="c-companies"></span></div>
    <div class="nav" data-view="pipeline"><span class="ic">▤</span><span>Pipeline</span><span class="c" id="c-pipe"></span></div>
    <div class="nav" data-view="deals"><span class="ic">＄</span><span>Deals</span><span class="c" id="c-deals"></span></div>
    <div class="nav" data-view="activities"><span class="ic">⌁</span><span>Activities</span><span class="c" id="c-acts"></span></div>
    <div class="sep"></div>
    <div class="ownerbox">
      <label>Owner scope</label>
      <select id="ownerScope" onchange="OWNER=this.value;render()">
        <option value="all">All owners</option>
        <option value="mine">Mine</option>
        <option value="unassigned">Unassigned</option>
      </select>
    </div>
    <div class="foot">
      <button class="btn sec sm" id="roleBtn" onclick="toggleRole()"></button>
      <button class="btn sec sm" onclick="exportData()">Export JSON</button>
      <div id="whoami" style="font-size:11px;color:var(--muted);margin-top:6px"></div>
      <button class="btn sec sm" onclick="signOut()">Sign out</button>
      <div id="syncstatus" style="margin-top:4px;font-size:11px;font-weight:600;color:#d97706">● Connecting…</div>
    </div>
  </aside>
  <div class="navbackdrop" onclick="toggleNav(false)"></div>
  <div class="body">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false" onclick="toggleNav()">☰</button>
      <div class="topsearch">
        <input id="gsearch" autocomplete="off" placeholder="🔍  Search people, companies, deals…" oninput="globalSearch(this.value)" onblur="setTimeout(()=>{const r=document.getElementById('gresults');if(r)r.innerHTML='';},180)">
        <div id="gresults"></div>
      </div>
      <div class="menu" id="newmenu">
        <button class="btn" onclick="document.getElementById('newmenu').classList.toggle('open')">+ New ▾</button>
        <div class="pop">
          <a onclick="newMenu('contact')">👤 Contact</a>
          <a onclick="newMenu('company')">🏢 Company</a>
          <a onclick="newMenu('deal')">＄ Deal</a>
          <a onclick="newMenu('activity')">⌁ Log activity</a>
        </div>
      </div>
    </div>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js" integrity="sha384-nD3dwv4+ZqdYnmZKe/249ImlV04om7xTCcsoSeQYI+RO+XlKPoqAWaJR1M5SJH9p" crossorigin="anonymous"></script>
<script>
/* ================= SHARED BACKEND (Supabase) =================
   CRM SPA (OMN-58/OMN-68) bound to the canonical CRM backend (OMN-59 + OMN-67
   deltas) on the Convergence project, schema `public`. Access is gated by
   Supabase Auth (email/password) — the publishable/anon key alone returns
   nothing because RLS grants CRUD only to the `authenticated` role.

   This build closes the OMN-60 design-spec conformance gaps (OMN-74):
     §2/§6  first-class Companies module (6-module IA)
     §3     global search, global [+ New], owner-scope filter, Editor/Viewer
     §3.3/§10 optimistic undo toast (6s) on every mutation
     §4     Won-MTD-vs-target bar + needs-attention nudges (overdue/stalled/cold)
     §7     stalled-deal flag (in-stage > 21d) + Won/Lost confirm on stage move
     §8.1   Deals forecast table — weighted column + filter-aware footer totals

   Canonical columns used: deals.stage_entered_at (stalled), owner_id (scope),
   custom_fields.lost_reason (lost reason), weighted_value (generated). */
const SB_URL = "https://krthbgtykwamxqvapxnx.supabase.co";
const SB_KEY = "sb_publishable_ToA4drk8mWPKiG6RsxRGyA_GC7iXSqf"; // publishable (anon) key — identifies the project only; RLS requires an authenticated session
const T = { contacts:"contacts", deals:"deals", activities:"activities", pipelines:"pipelines", stages:"pipeline_stages" };
let sb = null;
try { sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } }); } catch(e){ sb = null; }

/* in-memory store (camelCase). companies/people are both rows of `contacts`. */
let DB = { companies:[], people:[], deals:[], activities:[] };
let STAGES = [];            // [{id,label,position,isWon,isLost,defProb,cls}]
let PIPELINE_ID = null;     // default pipeline id (deals.pipeline_id is NOT NULL)
let VIEW = "dashboard";
let OWNER = "all";          // owner scope: all | mine | unassigned
let ROLE = "editor";        // client UX role: editor | viewer (RLS is the real boundary)
let SESSION_EMAIL = "";
let SESSION_UID = "";
let TODAY = new Date().toISOString().slice(0,10);
const STALL_DAYS = 21, COLD_DAYS = 30;
const WON_TARGET = +(localStorage.getItem("crm_won_target")||200000); // §4 Won-MTD target (configurable)

const ACT_ICON = {call:"📞", email:"✉️", meeting:"🗓️", note:"📝", task:"✅", other:"•"};
const STAGE_CLS_BY_POS = ["grey","blue","violet","amber","green","red"];

/* ---------- mappers (canonical row <-> in-memory object) ---------- */
function companyToObj(r){ return {id:r.id,name:r.name,domain:r.website||"",address:r.address||"",tags:r.tags||[],ownerId:r.owner_id||""}; }
function companyToRow(o){ return {kind:"company",name:o.name,website:o.domain||null,address:o.address||null,tags:o.tags||[],company_id:null}; }
function personToObj(r){ return {id:r.id,name:r.name,email:r.email||"",phone:r.phone||"",title:r.title||"",companyId:r.company_id||"",tags:r.tags||[],ownerId:r.owner_id||""}; }
function personToRow(o){ return {kind:"person",name:o.name,email:o.email||null,phone:o.phone||null,title:o.title||null,company_id:o.companyId||null,tags:o.tags||[]}; }
function dealToObj(r){ return {id:r.id,title:r.name,contactId:r.contact_id||"",stageId:r.stage_id||"",value:+r.value||0,probability:Math.round((+r.probability||0)*100),weighted:+r.weighted_value||0,status:r.status,closeDate:r.expected_close_date||"",ownerId:r.owner_id||"",stageSince:(r.stage_entered_at||r.created_at||"").slice(0,10),customFields:r.custom_fields||{},lostReason:(r.custom_fields&&r.custom_fields.lost_reason)||""}; }
function dealToRow(o){ return {name:o.title,pipeline_id:PIPELINE_ID,stage_id:o.stageId||null,contact_id:o.contactId||null,value:+o.value||0,probability:(+o.probability||0)/100,expected_close_date:o.closeDate||null}; }
function actToObj(r){ return {id:r.id,type:r.type,subject:r.subject||"",notes:r.notes||"",contactId:r.contact_id||"",dealId:r.deal_id||"",date:(r.activity_date||"").slice(0,10),ownerId:r.owner_id||""}; }
function actToRow(o){ return {type:o.type,subject:o.subject||null,notes:o.notes||null,contact_id:o.contactId||null,deal_id:o.dealId||null,activity_date:o.date?o.date:new Date().toISOString()}; }

/* ---------- low-level row ops ---------- */
async function rowInsert(table,row){ const {data,error}=await sb.from(table).insert(row).select().single(); if(error) throw error; return data; }
async function rowUpdate(table,id,row){ const {data,error}=await sb.from(table).update(row).eq("id",id).select().single(); if(error) throw error; return data; }
async function rowDelete(table,id){ const {error}=await sb.from(table).delete().eq("id",id); if(error) throw error; }

function setStatus(txt, ok){ const el=document.getElementById("syncstatus"); if(el){ el.textContent=txt; el.style.color = ok?"#16a34a":"#d97706"; } }

/* ---------- load everything for the signed-in session ---------- */
async function loadAll(){
  const [pl, st, ct, dl, ac] = await Promise.all([
    sb.from(T.pipelines).select("*").order("is_default",{ascending:false}),
    sb.from(T.stages).select("*").order("position",{ascending:true}),
    sb.from(T.contacts).select("*").order("created_at",{ascending:true}),
    sb.from(T.deals).select("*").order("value",{ascending:false}),
    sb.from(T.activities).select("*").order("activity_date",{ascending:false})
  ]);
  for(const r of [pl,st,ct,dl,ac]) if(r.error) throw r.error;
  const pipelines = pl.data||[];
  const def = pipelines.find(p=>p.is_default) || pipelines[0];
  PIPELINE_ID = def ? def.id : null;
  STAGES = (st.data||[]).filter(s=>!PIPELINE_ID||s.pipeline_id===PIPELINE_ID)
    .sort((a,b)=>a.position-b.position)
    .map((s,i)=>({id:s.id,label:s.name,position:s.position,isWon:s.is_won,isLost:s.is_lost,defProb:+s.default_probability,
      cls: s.is_won?"green": s.is_lost?"red": (STAGE_CLS_BY_POS[i]||"grey")}));
  const contacts = ct.data||[];
  DB.companies = contacts.filter(r=>r.kind==="company").map(companyToObj);
  DB.people    = contacts.filter(r=>r.kind==="person").map(personToObj);
  DB.deals     = (dl.data||[]).map(dealToObj);
  DB.activities= (ac.data||[]).map(actToObj);
}

async function init(){
  setStatus("● Connecting…", true);
  TODAY = new Date().toISOString().slice(0,10);
  try{
    await loadAll();
    setStatus("● Live · shared", true);
    document.getElementById("whoami").textContent = "Signed in: "+SESSION_EMAIL;
  }catch(e){
    setStatus("● Load failed", false); console.error("CRM load failed:", e);
    alert("Could not load CRM data: "+(e.message||e));
  }
  applyRole(); renderCounts(); go("dashboard");
}

/* ---------- helpers ---------- */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function money(n){ n=+n||0; return "$"+n.toLocaleString("en-US"); }
function moneyK(n){ n=+n||0; return n>=1000 ? "$"+Math.round(n/1000)+"k" : "$"+n; }
function daysBetween(a,b){ if(!a||!b) return 0; return Math.round((Date.parse(b.slice(0,10)+"T00:00:00Z")-Date.parse(a.slice(0,10)+"T00:00:00Z"))/86400000); }
function ageDays(d){ return d?daysBetween(d,TODAY):0; }
function relTime(d){ if(!d) return ""; const n=daysBetween(d,TODAY); if(n<=0) return "today"; if(n===1) return "1d ago"; if(n<30) return n+"d ago"; return Math.round(n/30)+"mo ago"; }
function relClose(d){ if(!d) return {t:"no date",c:"muted"}; const n=daysBetween(TODAY,d); if(n<0) return {t:Math.abs(n)+"d overdue",c:"warn"}; if(n===0) return {t:"today",c:"warn"}; return {t:"in "+n+"d",c:"muted"}; }
function company(id){ return DB.companies.find(c=>c.id===id); }
function person(id){ return DB.people.find(p=>p.id===id); }
function deal(id){ return DB.deals.find(d=>d.id===id); }
function companyName(id){ const c=company(id); return c?c.name:"—"; }
function contactLabel(id){ const p=person(id); if(p) return p.name+(p.companyId?(" · "+companyName(p.companyId)):""); const c=company(id); return c?c.name:"—"; }
function dealName(id){ const d=deal(id); return d?d.title:"—"; }
function stageMeta(id){ return STAGES.find(s=>s.id===id)||STAGES[0]||{id:"",label:"—",cls:"grey",isWon:false,isLost:false}; }
function stagePill(id){ const s=stageMeta(id); return `<span class="pill ${s.cls}">${esc(s.label)}</span>`; }
function isOpen(d){ return d.status!=="won"&&d.status!=="lost"; }
function initials(n){ return (n||"?").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase(); }
function companyOptions(val){ return `<option value="">— none —</option>`+DB.companies.map(c=>`<option value="${c.id}" ${c.id===val?"selected":""}>${esc(c.name)}</option>`).join(""); }
function contactOptions(val){
  const ppl=DB.people.map(p=>`<option value="${p.id}" ${p.id===val?"selected":""}>${esc(p.name)}${p.companyId?(" · "+esc(companyName(p.companyId))):""}</option>`).join("");
  const cos=DB.companies.map(c=>`<option value="${c.id}" ${c.id===val?"selected":""}>${esc(c.name)} (company)</option>`).join("");
  return `<option value="">— none —</option>`+ppl+cos;
}
function dealOptions(val){ return `<option value="">— none —</option>`+DB.deals.map(d=>`<option value="${d.id}" ${d.id===val?"selected":""}>${esc(d.title)}</option>`).join(""); }
function stageOptions(val){ return STAGES.map(s=>`<option value="${s.id}" ${s.id===val?"selected":""}>${esc(s.label)}</option>`).join(""); }
function tagsHtml(arr){ return (arr||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(""); }

/* ---------- owner scope (§3 global filter) ---------- */
function inScope(ownerId){ if(OWNER==="all") return true; if(OWNER==="mine") return ownerId&&ownerId===SESSION_UID; if(OWNER==="unassigned") return !ownerId; return true; }
function scopedDeals(){ return DB.deals.filter(d=>inScope(d.ownerId)); }
function scopedPeople(){ return DB.people.filter(p=>inScope(p.ownerId)); }
function scopedCompanies(){ return DB.companies.filter(c=>inScope(c.ownerId)); }
function scopedActs(){ return DB.activities.filter(a=>inScope(a.ownerId)); }

/* ---------- role (§3.3/§10 Editor / Viewer; UX only — RLS enforces real perms) ---------- */
function isEditor(){ return ROLE==="editor"; }
function edOnly(html){ return isEditor()?html:""; }
function toggleRole(){ ROLE=isEditor()?"viewer":"editor"; applyRole(); render(); }
function applyRole(){
  const b=document.getElementById("roleBtn"); if(b) b.textContent=isEditor()?"Role: Editor (switch to Viewer)":"Role: Viewer (switch to Editor)";
  document.getElementById("newmenu").style.display=isEditor()?"inline-block":"none";
}

/* ---------- stalled / cold (§4/§7) ---------- */
function isStalled(d){ return isOpen(d)&&ageDays(d.stageSince)>STALL_DAYS; }
function contactLastAct(pid){ const ds=DB.activities.filter(a=>a.contactId===pid).map(a=>a.date).filter(Boolean).sort(); return ds.length?ds[ds.length-1]:null; }
function isCold(pid){ const d=contactLastAct(pid); return !d||ageDays(d)>=COLD_DAYS; }
function isOverdue(d){ return isOpen(d)&&d.closeDate&&daysBetween(TODAY,d.closeDate)<0; }

function renderCounts(){
  document.getElementById("c-contacts").textContent=scopedPeople().length;
  document.getElementById("c-companies").textContent=scopedCompanies().length;
  document.getElementById("c-pipe").textContent=scopedDeals().filter(isOpen).length;
  document.getElementById("c-deals").textContent=scopedDeals().length;
  document.getElementById("c-acts").textContent=scopedActs().length;
}

/* ---------- modal / nav ---------- */
function openModal(html){ const m=document.getElementById("modal"); m.innerHTML=html; document.getElementById("modal-bg").classList.add("show"); }
function closeModal(){ document.getElementById("modal-bg").classList.remove("show"); }
document.getElementById("modal-bg").addEventListener("click",e=>{ if(e.target.id==="modal-bg") closeModal(); });
function toggleNav(force){ const app=document.getElementById("app"); const open=(typeof force==="boolean")?force:!app.classList.contains("navopen"); app.classList.toggle("navopen",open); const h=document.getElementById("hamburger"); if(h)h.setAttribute("aria-expanded",String(open)); }
function go(v){ VIEW=v; document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.view===v)); toggleNav(false); render(); }
document.querySelectorAll(".nav").forEach(n=>n.addEventListener("click",()=>go(n.dataset.view)));

/* ---------- undo toast (§3.3, 6s) ---------- */
let _undo=null,_toastT=null;
function toast(msg,undoFn){
  const el=document.getElementById("toast");
  _undo=undoFn||null;
  el.innerHTML=esc(msg)+(undoFn?` <button onclick="doUndo()">Undo</button>`:"");
  el.classList.add("show");
  clearTimeout(_toastT); _toastT=setTimeout(()=>{ el.classList.remove("show"); _undo=null; },6000);
}
async function doUndo(){ if(!_undo) return; const f=_undo; _undo=null; document.getElementById("toast").classList.remove("show");
  try{ await f(); }catch(e){ console.error("undo failed",e); await failAndReload(e); return; } renderCounts(); render(); }

/* error helper: on a failed write, reload from cloud to stay consistent */
async function failAndReload(e){ console.error("CRM write failed:", e); alert("Save failed: "+(e.message||e)+"\nReloading latest data."); try{ await loadAll(); }catch(_){} renderCounts(); render(); }

/* ---------- global search (§3) ---------- */
function globalSearch(q){
  const box=document.getElementById("gresults"); q=(q||"").trim().toLowerCase();
  if(!q){ box.innerHTML=""; return; }
  const res=[];
  DB.people.filter(p=>p.name.toLowerCase().includes(q)||(p.email||"").toLowerCase().includes(q)).slice(0,4).forEach(p=>res.push({k:"Contact",l:p.name,s:companyName(p.companyId),fn:`go('contacts');editPerson('${p.id}')`}));
  DB.companies.filter(c=>c.name.toLowerCase().includes(q)).slice(0,4).forEach(c=>res.push({k:"Company",l:c.name,s:c.domain||"",fn:`go('companies');editCompany('${c.id}')`}));
  DB.deals.filter(d=>d.title.toLowerCase().includes(q)).slice(0,4).forEach(d=>res.push({k:"Deal",l:d.title,s:moneyK(d.value)+" · "+stageMeta(d.stageId).label,fn:`go('deals');editDeal('${d.id}')`}));
  box.className="results";
  box.innerHTML=res.length?res.map(r=>`<div class="r" onmousedown="document.getElementById('gsearch').value='';document.getElementById('gresults').innerHTML='';${r.fn}"><span class="av">${esc(initials(r.l))}</span><div><div style="font-weight:600">${esc(r.l)}</div><div class="muted" style="font-size:11px">${esc(r.s)}</div></div><span class="k">${r.k}</span></div>`).join(""):`<div class="results"><div class="r muted">No matches</div></div>`;
}
function newMenu(kind){ document.getElementById("newmenu").classList.remove("open");
  if(kind==="contact"){ go("contacts"); editPerson(); }
  else if(kind==="company"){ go("companies"); editCompany(); }
  else if(kind==="deal"){ go("deals"); editDeal(); }
  else { editActivity(); }
}

/* ================= DASHBOARD (§4) ================= */
function viewDashboard(){
  const deals=scopedDeals();
  const open=deals.filter(isOpen);
  const won=deals.filter(d=>d.status==="won");
  const openVal=open.reduce((s,d)=>s+(+d.value||0),0);
  const wonVal=won.reduce((s,d)=>s+(+d.value||0),0);
  const weighted=open.reduce((s,d)=>s+(+d.weighted||0),0);
  const mtd=TODAY.slice(0,7);
  const wonMTD=won.filter(d=>(d.closeDate||"").slice(0,7)===mtd).reduce((s,d)=>s+(+d.value||0),0);
  const pct=Math.min(100,Math.round(wonMTD/WON_TARGET*100));
  const byStage=STAGES.filter(s=>!s.isWon&&!s.isLost).map(s=>{
    const ds=open.filter(d=>d.stageId===s.id); const v=ds.reduce((a,d)=>a+(+d.value||0),0);
    return {s, n:ds.length, v};
  });
  const maxV=Math.max(...byStage.map(x=>x.v),1);
  const topOpen=[...open].sort((a,b)=>(+b.value||0)-(+a.value||0)).slice(0,6);
  const feed=[...scopedActs()].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,8);
  const stalled=open.filter(isStalled).length;
  const overdue=open.filter(isOverdue).length;
  const cold=scopedPeople().filter(p=>isCold(p.id)).length;
  return `
  <div class="between"><div><h1>Dashboard</h1><p class="sub" style="margin:0">${OWNER==="all"?"All owners":OWNER==="mine"?"My records":"Unassigned"} · pipeline health — ${TODAY}</p></div></div>
  <div class="grid cards">
    <div class="card"><h3>Open pipeline</h3><div class="big">${moneyK(openVal)}</div><div class="meta">${open.length} open deals</div></div>
    <div class="card"><h3>Weighted forecast</h3><div class="big">${moneyK(weighted)}</div><div class="meta">value × probability</div></div>
    <div class="card"><h3>Won this month</h3><div class="big">${moneyK(wonMTD)}</div><div class="bar" style="margin-top:8px"><i style="width:${pct}%;background:var(--ok)"></i></div><div class="meta">${pct}% of ${moneyK(WON_TARGET)} target</div></div>
    <div class="card"><h3>Won (total)</h3><div class="big">${moneyK(wonVal)}</div><div class="meta">${won.length} closed-won</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1.3fr 1fr;margin-top:18px">
    <div>
      <div class="between"><h3 style="margin:0">Pipeline by stage</h3><a class="nav" style="display:inline-flex;padding:4px 8px" onclick="go('pipeline')">Open pipeline →</a></div>
      <table><thead><tr><th>Stage</th><th class="num">Deals</th><th>Value</th></tr></thead><tbody>
      ${byStage.map(x=>`<tr><td>${stagePill(x.s.id)}</td><td class="num">${x.n}</td><td><div class="row"><div class="bar" style="flex:1"><i style="width:${x.v/maxV*100}%"></i></div><span class="num" style="min-width:54px">${moneyK(x.v)}</span></div></td></tr>`).join("")}
      </tbody></table>
      <div class="between" style="margin-top:20px"><h3 style="margin:0">Top open deals</h3></div>
      <table><thead><tr><th>Deal</th><th>Stage</th><th class="num">Value</th><th class="num">Weighted</th></tr></thead><tbody>
      ${topOpen.map(d=>`<tr><td><b>${esc(d.title)}</b>${isStalled(d)?' <span class="pill amber">stalled</span>':""}<div class="muted" style="font-size:12px">${esc(contactLabel(d.contactId))}</div></td><td>${stagePill(d.stageId)}</td><td class="num">${moneyK(d.value)}</td><td class="num muted">${moneyK(d.weighted)}</td></tr>`).join("")||'<tr><td colspan=4 class=muted>No open deals</td></tr>'}
      </tbody></table>
    </div>
    <div>
      <div class="between"><h3 style="margin:0">Needs attention</h3></div>
      <div class="card" style="margin-bottom:16px">
        <div class="nudge"><span class="warn">${overdue}</span> deals overdue (past close date)</div>
        <div class="nudge"><span class="warn">${stalled}</span> deals stalled (in-stage &gt; ${STALL_DAYS}d)</div>
        <div class="nudge"><span class="warn">${cold}</span> contacts cold (no activity ${COLD_DAYS}d+)</div>
      </div>
      <div class="between"><h3 style="margin:0">Activity feed</h3><a class="nav" style="display:inline-flex;padding:4px 8px" onclick="go('activities')">All →</a></div>
      <div class="card"><div class="feed">
      ${feed.map(a=>`<div class="fi"><div class="ico">${ACT_ICON[a.type]||"•"}</div><div style="flex:1"><div style="font-weight:600">${esc(a.subject)}</div><div class="muted" style="font-size:12px">${relTime(a.date)}${a.contactId?(" · "+esc(contactLabel(a.contactId))):""}</div></div></div>`).join("")||'<div class="muted" style="padding:12px 0">No activity yet</div>'}
      </div></div>
    </div>
  </div>`;
}

async function savePerson(e,id){ e.preventDefault(); const f=e.target;
  const tags=f.tags.value.split(",").map(s=>s.trim()).filter(Boolean);
  const obj={name:f.name.value,title:f.title.value,email:f.email.value,phone:f.phone.value,companyId:f.companyId.value,tags};
  closeModal();
  try{
    if(id){ const before=person(id), prevRow=personToRow(before); const r=await rowUpdate(T.contacts,id,personToRow(obj)); Object.assign(person(id),personToObj(r));
      toast("Contact updated", async()=>{ const rr=await rowUpdate(T.contacts,id,prevRow); Object.assign(person(id),personToObj(rr)); }); }
    else { const r=await rowInsert(T.contacts,personToRow(obj)); const nid=r.id; DB.people.push(personToObj(r));
      toast("Contact added", async()=>{ await rowDelete(T.contacts,nid); DB.people=DB.people.filter(x=>x.id!==nid); }); }
    renderCounts(); render();
  }catch(err){ failAndReload(err); }
}

/* ================= PIPELINE / KANBAN (§7) ================= */
function viewPipeline(){
  const head=`<div class="between"><div><h1>Pipeline</h1><p class="sub" style="margin:0">Drag cards to change stage · amber edge = stalled (&gt; ${STALL_DAYS}d in stage)</p></div>
    <div class="row">${edOnly(`<button class="btn" onclick="editDeal()">+ New Deal</button>`)}</div></div>`;
  const ds=scopedDeals();
  const cols=STAGES.map(s=>{
    const items=ds.filter(d=>d.stageId===s.id);
    const v=items.reduce((a,d)=>a+(+d.value||0),0);
    const cards=items.map(d=>`<div class="deal${isStalled(d)?' stalled':''}" ${isEditor()?`draggable="true" ondragstart="dragDeal(event,'${d.id}')"`:""} onclick="editDeal('${d.id}')">
        <div class="t">${esc(d.title)}</div>
        <div class="m">${esc(contactLabel(d.contactId))}</div>
        <div class="row" style="justify-content:space-between;margin-top:6px"><span class="v">${moneyK(d.value)}</span><span class="tag">${d.probability||0}%</span></div>
        <div class="m" style="margin-top:5px">${isStalled(d)?`<span class="warn">${ageDays(d.stageSince)}d in stage</span>`:esc(d.closeDate||"no date")}</div>
      </div>`).join("");
    return `<div class="col"><div class="col-h"><span>${esc(s.label)} <span class="muted">(${items.length})</span></span><span class="sum">${moneyK(v)}</span></div>
      <div class="col-b" ${isEditor()?`ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropDeal(event,'${s.id}')"`:""}>${cards||'<div class="muted" style="font-size:12px;padding:6px">—</div>'}</div></div>`;
  }).join("");
  return head+`<div class="kanban">${cols}</div>`;
}
let _dragId=null;
function dragDeal(e,id){ _dragId=id; e.dataTransfer.effectAllowed="move"; }
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add("drag"); }
function dragLeave(e){ e.currentTarget.classList.remove("drag"); }
async function dropDeal(e,stageId){ e.preventDefault(); e.currentTarget.classList.remove("drag"); const id=_dragId; _dragId=null; if(!id) return; const d=deal(id); if(!d||d.stageId===stageId) return; moveDealToStage(id,stageId); }

/* §7: stage move — Won → confirm amount, Lost → reason; else direct move (+ undo) */
function moveDealToStage(id,stageId){
  const d=deal(id); if(!d) return; const s=stageMeta(stageId);
  if(s.isWon){ confirmWon(id,stageId); return; }
  if(s.isLost){ confirmLost(id,stageId); return; }
  applyStageMove(id,stageId,{});
}
async function applyStageMove(id,stageId,extra){
  const d=deal(id); if(!d) return; const prevStage=d.stageId, prevCF=d.customFields;
  const row=Object.assign({stage_id:stageId}, extra||{});
  try{ const r=await rowUpdate(T.deals,id,row); Object.assign(d,dealToObj(r)); renderCounts(); render();
    toast(`Moved “${d.title}” to ${stageMeta(stageId).label}`, async()=>{ const rr=await rowUpdate(T.deals,id,{stage_id:prevStage,custom_fields:prevCF}); Object.assign(deal(id),dealToObj(rr)); });
  }catch(err){ failAndReload(err); }
}
function confirmWon(id,stageId){
  const d=deal(id);
  openModal(`<h2>Mark “${esc(d.title)}” as Won 🎉</h2><form onsubmit="submitWon(event,'${id}','${stageId}')">
    <p class="sub">Confirm the final deal amount before closing.</p>
    <div class="fgrid"><div class="full"><label>Won amount ($)</label><input name="value" type="number" min="0" step="any" value="${d.value||0}" autofocus></div></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn sec" onclick="closeModal();render()">Cancel</button><button class="btn">Confirm Won</button></div>
  </form>`);
}
function submitWon(e,id,stageId){ e.preventDefault(); const v=+e.target.value.value||0; closeModal(); applyStageMove(id,stageId,{value:v}); }
function confirmLost(id,stageId){
  const d=deal(id);
  openModal(`<h2>Mark “${esc(d.title)}” as Lost</h2><form onsubmit="submitLost(event,'${id}','${stageId}')">
    <p class="sub">A reason is required so the loss is learnable.</p>
    <div class="fgrid"><div class="full"><label>Lost reason</label><input name="reason" required placeholder="e.g. price, timing, chose competitor" autofocus></div></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn sec" onclick="closeModal();render()">Cancel</button><button class="btn danger">Confirm Lost</button></div>
  </form>`);
}
function submitLost(e,id,stageId){ e.preventDefault(); const reason=e.target.reason.value.trim(); const d=deal(id); closeModal();
  const cf=Object.assign({},d.customFields||{},{lost_reason:reason}); applyStageMove(id,stageId,{custom_fields:cf}); }

/* ================= DEALS — forecast table (§8.1) ================= */
let dealSeg="open";
function viewDeals(){
  const seg=`<div class="seg">${["open","won","lost","all"].map(k=>`<button class="${dealSeg===k?'on':''}" onclick="dealSeg='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>`;
  const head=`<div class="between"><div><h1>Deals</h1><p class="sub" style="margin:0">Forecast table — weighted (value × probability) with filter-aware totals</p></div>
    <div class="row">${seg}${edOnly(`<button class="btn" onclick="editDeal()">+ New Deal</button>`)}</div></div>`;
  let list=scopedDeals();
  if(dealSeg==="open") list=list.filter(isOpen);
  else if(dealSeg==="won") list=list.filter(d=>d.status==="won");
  else if(dealSeg==="lost") list=list.filter(d=>d.status==="lost");
  const pos={}; STAGES.forEach(s=>pos[s.id]=s.position);
  list=[...list].sort((a,b)=>(pos[a.stageId]??0)-(pos[b.stageId]??0)||(+b.value||0)-(+a.value||0));
  const totVal=list.reduce((s,d)=>s+(+d.value||0),0);
  const totW=list.reduce((s,d)=>s+(+d.weighted||0),0);
  const rows=list.map(d=>{ const rc=relClose(d.closeDate); return `<tr>
    <td><b>${esc(d.title)}</b>${isStalled(d)?' <span class="pill amber">stalled</span>':""}<div class="muted" style="font-size:12px">${esc(contactLabel(d.contactId))}</div></td>
    <td>${stagePill(d.stageId)}</td>
    <td class="num">${money(d.value)}</td>
    <td class="num">${d.probability||0}%</td>
    <td class="num muted">${money(d.weighted)}</td>
    <td class="${rc.c}">${esc(d.closeDate||"")}${d.closeDate?` <span style="font-size:11px">(${rc.t})</span>`:""}</td>
    <td>${edOnly(`<button class="iconbtn" onclick="editDeal('${d.id}')">Edit</button><button class="iconbtn" onclick="delItem('deals','${d.id}')">✕</button>`)}</td>
  </tr>`;}).join("");
  return head+`<table><thead><tr><th>Deal</th><th>Stage</th><th class="num">Value</th><th class="num">Prob.</th><th class="num">Weighted</th><th>Close</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=7 class=empty>No deals in this segment.</td></tr>'}</tbody>
    <tfoot><tr><td>${list.length} deal${list.length===1?"":"s"} · ${dealSeg}</td><td></td><td class="num">${money(totVal)}</td><td></td><td class="num">${money(totW)}</td><td colspan=2></td></tr></tfoot>
    </table>`;
}
function editDeal(id){
  const firstOpen=(STAGES.find(s=>!s.isWon&&!s.isLost)||STAGES[0]||{}).id||"";
  const d=id?deal(id):{title:"",contactId:"",value:0,stageId:firstOpen,probability:"",closeDate:"",lostReason:""};
  openModal(`<h2>${id?"Edit":"New"} Deal</h2><form onsubmit="saveDeal(event,'${id||""}')">
    <div class="fgrid">
      <div class="full"><label>Title</label><input name="title" required value="${esc(d.title)}"></div>
      <div class="full"><label>Contact (person or company)</label><select name="contactId">${contactOptions(d.contactId)}</select></div>
      <div><label>Value ($)</label><input name="value" type="number" min="0" step="any" value="${d.value||0}"></div>
      <div><label>Stage</label><select name="stageId">${stageOptions(d.stageId)}</select></div>
      <div><label>Probability (%) <span class="muted" style="font-weight:400">— blank = stage default</span></label><input name="probability" type="number" min="0" max="100" value="${d.probability===""||d.probability==null?"":d.probability}"></div>
      <div><label>Close date</label><input name="closeDate" type="date" value="${esc(d.closeDate)}"></div>
      ${d.lostReason?`<div class="full"><label>Lost reason</label><input value="${esc(d.lostReason)}" disabled></div>`:""}
    </div>
    <div class="row" style="justify-content:space-between">
      <div>${id?`<button type="button" class="btn sec sm" onclick="logForDeal('${id}')">+ Log activity</button>`:""}</div>
      <div class="row"><button type="button" class="btn sec" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div>
    </div>
  </form>`);
}
async function saveDeal(e,id){ e.preventDefault(); const f=e.target;
  const probRaw=f.probability.value.trim();
  const obj={title:f.title.value,contactId:f.contactId.value,value:+f.value.value||0,stageId:f.stageId.value,probability:probRaw===""?null:(+probRaw||0),closeDate:f.closeDate.value};
  const row=dealToRow(obj);
  if(probRaw==="") delete row.probability; // let stage-default trigger fill it
  closeModal();
  try{
    if(id){
      const before=deal(id), prevRow=dealToRow(before); if(before.probability!=null) prevRow.probability=(+before.probability||0)/100;
      const r=await rowUpdate(T.deals,id,row); Object.assign(deal(id),dealToObj(r));
      toast("Deal updated", async()=>{ const rr=await rowUpdate(T.deals,id,prevRow); Object.assign(deal(id),dealToObj(rr)); });
    } else {
      const r=await rowInsert(T.deals,row); const nid=r.id; DB.deals.push(dealToObj(r));
      toast("Deal added", async()=>{ await rowDelete(T.deals,nid); DB.deals=DB.deals.filter(x=>x.id!==nid); });
    }
    renderCounts(); render();
  }catch(err){ failAndReload(err); }
}
function logForDeal(dealId){ const d=deal(dealId); closeModal(); editActivity(null,{dealId,contactId:d?d.contactId:""}); }

/* ================= ACTIVITIES ================= */
let actFilter="all";
function viewActivities(){
  const seg=`<div class="seg">${["all","call","email","meeting","note"].map(k=>`<button class="${actFilter===k?'on':''}" onclick="actFilter='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>`;
  let list=scopedActs();
  if(actFilter!=="all") list=list.filter(a=>a.type===actFilter);
  list=[...list].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const rows=list.map(a=>`<tr>
    <td><span class="tag">${ACT_ICON[a.type]||""} ${esc(a.type)}</span></td>
    <td><b>${esc(a.subject)}</b>${a.notes?`<div class="muted" style="font-size:12px">${esc(a.notes)}</div>`:""}</td>
    <td class="muted">${a.contactId?esc(contactLabel(a.contactId)):""}${a.dealId?`<div style="font-size:12px">${esc(dealName(a.dealId))}</div>`:""}</td>
    <td class="muted">${esc(a.date||"")}</td>
    <td>${edOnly(`<button class="iconbtn" onclick="editActivity('${a.id}')">Edit</button><button class="iconbtn" onclick="delItem('activities','${a.id}')">✕</button>`)}</td>
  </tr>`).join("");
  return `<div class="between"><div><h1>Activities</h1><p class="sub" style="margin:0">Calls · emails · meetings · notes logged against contacts &amp; deals</p></div>
    <div class="row">${seg}${edOnly(`<button class="btn" onclick="editActivity()">+ Log Activity</button>`)}</div></div>
    <table><thead><tr><th>Type</th><th>Subject</th><th>Linked to</th><th>Date</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=5 class=empty>No activities in scope.</td></tr>'}</tbody></table>`;
}
function editActivity(id,pre){
  const a=id?DB.activities.find(x=>x.id===id):Object.assign({type:"call",subject:"",notes:"",contactId:"",dealId:"",date:TODAY},pre||{});
  openModal(`<h2>${id?"Edit":"Log"} Activity</h2><form onsubmit="saveActivity(event,'${id||""}')">
    <div class="fgrid">
      <div><label>Type</label><select name="type">${["call","email","meeting","note","task"].map(t=>`<option value="${t}" ${t===a.type?"selected":""}>${ACT_ICON[t]||""} ${t}</option>`).join("")}</select></div>
      <div><label>Date</label><input name="date" type="date" value="${esc(a.date)}"></div>
      <div class="full"><label>Subject</label><input name="subject" required value="${esc(a.subject)}"></div>
      <div><label>Contact</label><select name="contactId">${contactOptions(a.contactId)}</select></div>
      <div><label>Deal</label><select name="dealId">${dealOptions(a.dealId)}</select></div>
      <div class="full"><label>Notes</label><textarea name="notes" rows="3">${esc(a.notes)}</textarea></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn sec" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div>
  </form>`);
}
async function saveActivity(e,id){ e.preventDefault(); const f=e.target;
  const obj={type:f.type.value,subject:f.subject.value,notes:f.notes.value,contactId:f.contactId.value,dealId:f.dealId.value,date:f.date.value};
  if(!obj.contactId && !obj.dealId){ alert("Link the activity to a contact or a deal."); return; }
  closeModal();
  try{
    if(id){ const before=DB.activities.find(x=>x.id===id), prevRow=actToRow(before); const r=await rowUpdate(T.activities,id,actToRow(obj)); Object.assign(DB.activities.find(x=>x.id===id),actToObj(r));
      toast("Activity updated", async()=>{ const rr=await rowUpdate(T.activities,id,prevRow); Object.assign(DB.activities.find(x=>x.id===id),actToObj(rr)); }); }
    else { const r=await rowInsert(T.activities,actToRow(obj)); const nid=r.id; DB.activities.push(actToObj(r));
      toast("Activity logged", async()=>{ await rowDelete(T.activities,nid); DB.activities=DB.activities.filter(x=>x.id!==nid); }); }
    renderCounts(); render();
  }catch(err){ failAndReload(err); }
}

/* ---------- shared delete (with undo re-insert) ---------- */
const COLL_TABLE={companies:T.contacts,people:T.contacts,deals:T.deals,activities:T.activities};
const COLL_TOROW={companies:companyToRow,people:personToRow,deals:dealToRow,activities:actToRow};
const COLL_TOOBJ={companies:companyToObj,people:personToObj,deals:dealToObj,activities:actToObj};
async function delItem(coll,id){ if(!confirm("Delete this item?")) return;
  const before=DB[coll].find(x=>x.id===id); const payload=COLL_TOROW[coll](before);
  try{ await rowDelete(COLL_TABLE[coll],id); DB[coll]=DB[coll].filter(x=>x.id!==id);
    const needsReload=(coll==="companies"||coll==="people"||coll==="deals");
    if(needsReload){ try{ await loadAll(); }catch(_){} }
    renderCounts(); render();
    toast("Deleted", async()=>{ const r=await rowInsert(COLL_TABLE[coll],payload); if(needsReload){ await loadAll(); } else { DB[coll].push(COLL_TOOBJ[coll](r)); } });
  }catch(err){ failAndReload(err); }
}
function exportData(){ const b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="agency-crm-data.json"; a.click(); }

/* ---------- render dispatch ---------- */
function render(){
  renderCounts();
  const m=document.getElementById("main");
  m.innerHTML = VIEW==="dashboard"?viewDashboard()
    : VIEW==="contacts"?viewContacts()
    : VIEW==="companies"?viewCompanies()
    : VIEW==="pipeline"?viewPipeline()
    : VIEW==="deals"?viewDeals()
    : viewActivities();
}

/* ================= AUTH (Supabase email/password) ================= */
function showLogin(msg){
  document.getElementById("app").style.display="none";
  let o=document.getElementById("authwrap");
  if(!o){ o=document.createElement("div"); o.id="authwrap"; o.className="authwrap"; document.body.appendChild(o); }
  o.innerHTML=`<form class="authcard" id="loginForm">
    <h1>Agency CRM</h1>
    <p class="sub">Internal sales suite — board sign-in</p>
    <p class="autherr" id="authErr" style="${msg?"display:block":""}">${esc(msg||"")}</p>
    <label>Email</label>
    <input id="authEmail" type="email" autocomplete="username" autofocus placeholder="you@company.com">
    <label style="margin-top:12px">Password</label>
    <input id="authPass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button type="submit" class="btn" style="width:100%;margin-top:18px;padding:11px">Sign in</button>
    <p style="color:#5b6573;font-size:11px;text-align:center;margin:18px 0 0">Authenticated access · Supabase Auth · RLS-protected</p>
  </form>`;
  document.getElementById("loginForm").addEventListener("submit",async(e)=>{
    e.preventDefault();
    const email=document.getElementById("authEmail").value.trim();
    const password=document.getElementById("authPass").value;
    const btn=e.target.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent="Signing in…";
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ const el=document.getElementById("authErr"); el.textContent=error.message||"Sign-in failed."; el.style.display="block"; btn.disabled=false; btn.textContent="Sign in"; return; }
    SESSION_EMAIL = (data&&data.user&&data.user.email)||email;
    SESSION_UID = (data&&data.user&&data.user.id)||"";
    o.remove();
    document.getElementById("app").style.display="flex";
    init();
  });
}
async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }

async function boot(){
  if(!sb){ showLogin("Supabase client failed to load. Check your connection and reload."); return; }
  const { data } = await sb.auth.getSession();
  if(data && data.session){
    SESSION_EMAIL = data.session.user.email||"";
    SESSION_UID = data.session.user.id||"";
    document.getElementById("app").style.display="flex";
    init();
  } else {
    showLogin("");
  }
}
boot();
</script>
