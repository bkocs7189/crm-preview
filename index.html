<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Convergence CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1d212c; --line: #2a2f3c;
    --txt: #e7e9ee; --muted: #9aa3b2; --accent: #6366f1; --accent-2: #818cf8;
    --green: #34d399; --amber: #fbbf24; --red: #f87171; --blue: #60a5fa;
    --radius: 12px; --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--txt); font-size: 14px; line-height: 1.45;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea {
    font-family: inherit; font-size: 14px; background: var(--panel-2);
    border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 9px 11px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { display:block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 600; }
  .btn:hover { background: var(--accent-2); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--txt); }
  .btn.ghost:hover { border-color: var(--accent); }
  .btn.sm { padding: 6px 11px; font-size: 13px; }
  .btn.danger { background: transparent; border: 1px solid var(--line); color: var(--red); }

  #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(1200px 600px at 50% -10%, #1b1f2e, var(--bg)); z-index: 50; }
  .gate-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px; width: 340px; box-shadow: var(--shadow); text-align: center; }
  .gate-card h1 { margin: 6px 0 2px; font-size: 22px; }
  .gate-card p { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); margin: 0 auto 14px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:#fff; }
  #gateErr { color: var(--red); font-size: 12px; min-height: 16px; margin-top: 8px; }

  #app { display: none; min-height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(15,17,23,.92); backdrop-filter: blur(8px); z-index: 20; }
  .topbar .logo { width: 32px; height: 32px; font-size: 16px; border-radius: 9px; margin: 0; }
  .brand { font-weight: 700; font-size: 16px; }
  .sync { margin-left: auto; font-size: 12px; color: var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .layout { display: flex; min-height: calc(100vh - 57px); }
  .nav { width: 210px; border-right: 1px solid var(--line); padding: 14px 10px; flex-shrink: 0; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 2px; cursor: pointer; }
  .nav a:hover { background: var(--panel); color: var(--txt); }
  .nav a.active { background: var(--panel-2); color: var(--txt); }
  .nav a .ic { width: 18px; text-align: center; }
  .main { flex: 1; padding: 22px; min-width: 0; }
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h2 { margin: 0; font-size: 20px; }
  .page-head .spacer { flex: 1; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 26px; font-weight: 800; margin-top: 6px; }
  .stat .s { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel-2); }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid var(--line); text-transform: capitalize; }
  .pill.lead { color: var(--muted); }
  .pill.qualified { color: var(--blue); border-color: rgba(96,165,250,.4); }
  .pill.proposal { color: var(--accent-2); border-color: rgba(129,140,248,.4); }
  .pill.negotiation { color: var(--amber); border-color: rgba(251,191,36,.4); }
  .pill.won { color: var(--green); border-color: rgba(52,211,153,.4); }
  .pill.lost { color: var(--red); border-color: rgba(248,113,113,.4); }
  .pill.call { color: var(--blue); } .pill.email { color: var(--accent-2); } .pill.meeting { color: var(--amber); } .pill.note { color: var(--muted); } .pill.task { color: var(--green); } .pill.other { color: var(--muted); }

  .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 240px; width: 240px; flex-shrink: 0; display: flex; flex-direction: column; max-height: calc(100vh - 160px); }
  .col-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .col-head .t { font-weight: 700; font-size: 13px; text-transform: capitalize; }
  .col-head .c { font-size: 12px; color: var(--muted); }
  .col-body { padding: 10px; overflow-y: auto; flex: 1; min-height: 60px; }
  .col-body.drag-over { background: var(--panel-2); }
  .deal-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 11px; margin-bottom: 9px; cursor: grab; }
  .deal-card:active { cursor: grabbing; }
  .deal-card.dragging { opacity: .5; }
  .deal-card .dn { font-weight: 600; margin-bottom: 5px; }
  .deal-card .dv { color: var(--green); font-weight: 700; font-size: 13px; }
  .deal-card .dc { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; display: none; }
  .overlay.show { display: block; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 420px; max-width: 92vw; background: var(--panel); border-left: 1px solid var(--line); z-index: 40; transform: translateX(100%); transition: transform .22s ease; overflow-y: auto; box-shadow: var(--shadow); }
  .drawer.show { transform: translateX(0); }
  .drawer-head { display:flex; align-items:center; gap:10px; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top:0; background: var(--panel); }
  .drawer-head h3 { margin: 0; font-size: 17px; flex: 1; }
  .drawer-body { padding: 18px; }
  .x { background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1; }
  .timeline { list-style: none; padding: 0; margin: 8px 0 0; }
  .timeline li { padding: 10px 0 10px 16px; border-left: 2px solid var(--line); position: relative; }
  .timeline li::before { content:''; position:absolute; left:-5px; top:14px; width:8px; height:8px; border-radius:50%; background: var(--accent); }
  .timeline .ts { font-size: 11px; color: var(--muted); }
  .kv { display:flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); gap: 12px; }
  .kv .k { color: var(--muted); flex-shrink: 0; }
  .kv span:last-child { text-align: right; }
  .muted { color: var(--muted); }
  .row { display:flex; gap: 10px; }
  .row > * { flex: 1; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  .search { max-width: 280px; }

  .menu-btn { display:none; background:none; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:6px 10px; }
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .nav { width: 100%; border-right: none; border-bottom: 1px solid var(--line); display: none; }
    .nav.open { display: block; }
    .nav a { display: inline-flex; }
    .menu-btn { display: inline-block; }
    .grid-2 { grid-template-columns: 1fr; }
    .main { padding: 16px; }
    .drawer { width: 100%; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="logo">C</div>
    <h1>Convergence CRM</h1>
    <p>Enter the board access code</p>
    <input id="gateInput" type="password" placeholder="Access code" autocomplete="off" />
    <div id="gateErr"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="checkGate()">Unlock</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <button class="menu-btn" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
    <div class="logo">C</div>
    <span class="brand">Convergence CRM</span>
    <span class="sync"><span class="dot"></span><span id="syncTxt">Live · Supabase</span></span>
  </div>
  <div class="layout">
    <nav class="nav">
      <a data-route="dashboard" class="active"><span class="ic">▦</span> Dashboard</a>
      <a data-route="contacts"><span class="ic">◉</span> Contacts</a>
      <a data-route="pipeline"><span class="ic">▥</span> Pipeline</a>
      <a data-route="deals"><span class="ic">$</span> Deals</a>
      <a data-route="activities"><span class="ic">≋</span> Activities</a>
    </nav>
    <main class="main" id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="drawerTitle">Detail</h3>
    <button class="x" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>
// ---------- Config ----------
const SUPABASE_URL = 'https://krthbgtykwamxqvapxnx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtydGhiZ3R5a3dhbXhxdmFweG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0OTIyMjgsImV4cCI6MjA5MzA2ODIyOH0.8vhbs-4xlNfqr8gqR0UBJOJ3X9i-jx4ZuUSNiHrsUAE';
const ACCESS_HASH = '0a016d61f6e9d9048392db716ce5a1f4def2cbd67ba4ba21db5bd4578bc26828';
// Canonical backend (OMN-59): crm_companies / crm_people / crm_deals / crm_activities
const STAGES = ['lead', 'qualified', 'proposal', 'negotiation', 'won', 'lost'];
const ACT_TYPES = ['call', 'email', 'meeting', 'note', 'task', 'other'];

let sb = null;
let state = { companies: [], people: [], deals: [], activities: [], route: 'dashboard' };

// ---------- Gate ----------
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function checkGate() {
  const v = document.getElementById('gateInput').value.trim();
  const err = document.getElementById('gateErr');
  if (!v) { err.textContent = 'Enter a code'; return; }
  if (await sha256(v) === ACCESS_HASH) { sessionStorage.setItem('crm_ok', '1'); boot(); }
  else { err.textContent = 'Incorrect access code'; }
}
document.getElementById('gateInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkGate(); });

// ---------- Boot ----------
async function boot() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  document.querySelectorAll('.nav a').forEach(a => a.addEventListener('click', () => go(a.dataset.route)));
  await loadAll();
  go('dashboard');
}
async function loadAll() {
  setSync('Syncing…', false);
  const [co, pe, de, ac] = await Promise.all([
    sb.from('crmui_companies').select('*').order('name'),
    sb.from('crmui_people').select('*').order('name'),
    sb.from('crmui_deals').select('*').order('value', { ascending: false }),
    sb.from('crmui_activities').select('*').order('date', { ascending: false }),
  ]);
  const err = co.error || pe.error || de.error || ac.error;
  if (err) { setSync('Sync error', false, true); console.error(err); return; }
  state.companies = co.data; state.people = pe.data; state.deals = de.data; state.activities = ac.data;
  setSync('Live · Supabase', true);
}
function setSync(txt, ok, bad) {
  document.getElementById('syncTxt').textContent = txt;
  const dot = document.querySelector('.dot');
  const c = bad ? 'var(--red)' : ok ? 'var(--green)' : 'var(--amber)';
  dot.style.background = c; dot.style.boxShadow = '0 0 8px ' + c;
}

// ---------- Routing ----------
function go(route) {
  state.route = route;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.route === route));
  document.querySelector('.nav').classList.remove('open');
  ({ dashboard: renderDashboard, contacts: renderContacts, pipeline: renderPipeline, deals: renderDeals, activities: renderActivities }[route])();
}

// ---------- Helpers ----------
const fmt$ = n => '$' + (Number(n) || 0).toLocaleString();
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const personName = id => (state.people.find(c => c.id === id) || {}).name || '—';
const companyName = id => (state.companies.find(c => c.id === id) || {}).name || '—';
const dateFmt = d => { if (!d) return '—'; const s = String(d); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); const x = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s); return isNaN(x) ? s : x.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
const isClosed = s => s === 'won' || s === 'lost';
const view = () => document.getElementById('view');
const newId = p => p + '-' + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10));
const todayISO = () => new Date().toISOString().slice(0, 10);

// ---------- Dashboard ----------
function renderDashboard() {
  const open = state.deals.filter(d => !isClosed(d.stage));
  const won = state.deals.filter(d => d.stage === 'won');
  const pipeline = open.reduce((s, d) => s + Number(d.value || 0), 0);
  const wonVal = won.reduce((s, d) => s + Number(d.value || 0), 0);
  const byStage = STAGES.map(s => ({ s, n: state.deals.filter(d => d.stage === s).length, v: state.deals.filter(d => d.stage === s).reduce((a, d) => a + Number(d.value || 0), 0) }));
  view().innerHTML = `
    <div class="page-head"><h2>Dashboard</h2></div>
    <div class="cards">
      <div class="stat"><div class="k">Open pipeline</div><div class="v">${fmt$(pipeline)}</div><div class="s">${open.length} active deals</div></div>
      <div class="stat"><div class="k">Won</div><div class="v" style="color:var(--green)">${fmt$(wonVal)}</div><div class="s">${won.length} deals</div></div>
      <div class="stat"><div class="k">Contacts</div><div class="v">${state.people.length}</div><div class="s">${state.companies.length} companies</div></div>
      <div class="stat"><div class="k">Activities</div><div class="v">${state.activities.length}</div><div class="s">logged</div></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <h3 style="margin-top:0">Pipeline by stage</h3>
        <table><tbody>
          ${byStage.map(b => `<tr onclick="go('pipeline')"><td><span class="pill ${b.s}">${b.s}</span></td><td class="muted">${b.n} deals</td><td style="text-align:right;color:var(--green)">${fmt$(b.v)}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div class="panel">
        <h3 style="margin-top:0">Recent activity</h3>
        <ul class="timeline">
          ${state.activities.slice(0, 6).map(a => `<li><div><span class="pill ${a.type}">${a.type}</span> ${esc(a.subject)}</div><div class="ts">${esc(personName(a.contact_id))} · ${dateFmt(a.date)}</div></li>`).join('') || '<li class="muted">No activity yet</li>'}
        </ul>
      </div>
    </div>`;
}

// ---------- Contacts (crm_people) ----------
function renderContacts(filter = '') {
  const list = state.people.filter(c => !filter || (c.name + companyName(c.company_id) + (c.email || '')).toLowerCase().includes(filter.toLowerCase()));
  view().innerHTML = `
    <div class="page-head">
      <h2>Contacts</h2>
      <input class="search" placeholder="Search contacts…" oninput="renderContacts(this.value)" value="${esc(filter)}" />
      <div class="spacer"></div>
      <button class="btn" onclick="contactForm()">+ New contact</button>
    </div>
    <div class="panel" style="padding:0">
      <table>
        <thead><tr><th>Name</th><th>Company</th><th>Title</th><th>Email</th></tr></thead>
        <tbody>
          ${list.map(c => `<tr onclick="contactDetail('${c.id}')"><td><b>${esc(c.name)}</b></td><td>${esc(companyName(c.company_id))}</td><td class="muted">${esc(c.title)}</td><td class="muted">${esc(c.email)}</td></tr>`).join('') || `<tr><td colspan="4" class="empty">No contacts</td></tr>`}
        </tbody>
      </table>
    </div>`;
}
function contactDetail(id) {
  const c = state.people.find(x => x.id === id); if (!c) return;
  const deals = state.deals.filter(d => d.contact_id === id);
  const acts = state.activities.filter(a => a.contact_id === id);
  openDrawer(esc(c.name), `
    <div class="kv"><span class="k">Company</span><span>${esc(companyName(c.company_id))}</span></div>
    <div class="kv"><span class="k">Title</span><span>${esc(c.title) || '—'}</span></div>
    <div class="kv"><span class="k">Email</span><span>${esc(c.email) || '—'}</span></div>
    <div class="kv"><span class="k">Phone</span><span>${esc(c.phone) || '—'}</span></div>
    ${c.notes ? `<p class="muted" style="margin-top:12px">${esc(c.notes)}</p>` : ''}
    <div class="row" style="margin-top:14px">
      <button class="btn sm ghost" onclick="contactForm('${c.id}')">Edit</button>
      <button class="btn sm ghost" onclick="activityForm({contact_id:'${c.id}'})">Log activity</button>
    </div>
    <h4 style="margin:20px 0 6px">Deals (${deals.length})</h4>
    ${deals.map(d => `<div class="kv"><span>${esc(d.title)}</span><span class="pill ${d.stage}">${d.stage}</span></div>`).join('') || '<div class="muted">No deals</div>'}
    <h4 style="margin:20px 0 6px">Activity timeline</h4>
    <ul class="timeline">
      ${acts.map(a => `<li><div><span class="pill ${a.type}">${a.type}</span> ${esc(a.subject)}</div>${a.notes ? `<div class="muted" style="font-size:13px">${esc(a.notes)}</div>` : ''}<div class="ts">${dateFmt(a.date)}</div></li>`).join('') || '<li class="muted">No activity</li>'}
    `);
}
function contactForm(id) {
  const c = id ? state.people.find(x => x.id === id) : {};
  const copts = state.companies.map(co => `<option value="${co.id}" ${co.id === c.company_id ? 'selected' : ''}>${esc(co.name)}</option>`).join('');
  openDrawer(id ? 'Edit contact' : 'New contact', `
    <label>Name</label><input id="f_name" value="${esc(c.name)}" />
    <label>Company</label><select id="f_company"><option value="">—</option>${copts}</select>
    <label>Title</label><input id="f_title" value="${esc(c.title)}" />
    <div class="row"><div><label>Email</label><input id="f_email" value="${esc(c.email)}" /></div><div><label>Phone</label><input id="f_phone" value="${esc(c.phone)}" /></div></div>
    <label>Notes</label><textarea id="f_notes" rows="3">${esc(c.notes)}</textarea>
    <button class="btn" style="width:100%;margin-top:16px" onclick="saveContact('${id || ''}')">Save</button>
    ${id ? `<button class="btn danger" style="width:100%;margin-top:8px" onclick="delRow('crmui_people','${id}','contacts')">Delete</button>` : ''}
  `);
}
async function saveContact(id) {
  const row = { name: val('f_name'), company_id: val('f_company') || null, title: val('f_title'), email: val('f_email') || null, phone: val('f_phone') || null, notes: val('f_notes') || null };
  if (!row.name) return alert('Name required');
  await upsert('crmui_people', id, row, 'pe'); closeDrawer(); await loadAll(); go('contacts');
}

// ---------- Pipeline (Kanban + DnD) ----------
function renderPipeline() {
  view().innerHTML = `
    <div class="page-head"><h2>Pipeline</h2><div class="spacer"></div><button class="btn" onclick="dealForm()">+ New deal</button></div>
    <div class="board" id="board">
      ${STAGES.map(s => {
        const deals = state.deals.filter(d => d.stage === s);
        const total = deals.reduce((a, d) => a + Number(d.value || 0), 0);
        return `<div class="col">
          <div class="col-head"><span class="t">${s}</span><span class="c">${deals.length} · ${fmt$(total)}</span></div>
          <div class="col-body" data-stage="${s}" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${s}')">
            ${deals.map(d => `<div class="deal-card" draggable="true" data-id="${d.id}" ondragstart="dragStart(event,'${d.id}')" ondragend="dragEnd(event)" onclick="dealDetail('${d.id}')">
              <div class="dn">${esc(d.title)}</div>
              <div class="dv">${fmt$(d.value)}</div>
              <div class="dc">${esc(personName(d.contact_id))} · ${dateFmt(d.close_date)}</div>
            </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
let dragId = null;
function dragStart(e, id) { dragId = id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function dragEnd(e) { e.currentTarget.classList.remove('dragging'); }
function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
async function drop(e, stage) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if (!dragId) return;
  const deal = state.deals.find(d => d.id === dragId);
  if (deal && deal.stage !== stage) {
    deal.stage = stage;
    renderPipeline();
    const r = await sb.from('crmui_deals').update({ stage }).eq('id', dragId);
    if (r.error) { alert('Move failed: ' + r.error.message); await loadAll(); renderPipeline(); }
  }
  dragId = null;
}

// ---------- Deals (crm_deals) ----------
function renderDeals() {
  view().innerHTML = `
    <div class="page-head"><h2>Deals</h2><div class="spacer"></div><button class="btn" onclick="dealForm()">+ New deal</button></div>
    <div class="panel" style="padding:0">
      <table>
        <thead><tr><th>Deal</th><th>Contact</th><th>Stage</th><th>Value</th><th>Close date</th></tr></thead>
        <tbody>
          ${state.deals.map(d => `<tr onclick="dealDetail('${d.id}')"><td><b>${esc(d.title)}</b></td><td class="muted">${esc(personName(d.contact_id))}</td><td><span class="pill ${d.stage}">${d.stage}</span></td><td style="color:var(--green)">${fmt$(d.value)}</td><td class="muted">${dateFmt(d.close_date)}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">No deals</td></tr>`}
        </tbody>
      </table>
    </div>`;
}
function dealDetail(id) {
  const d = state.deals.find(x => x.id === id); if (!d) return;
  const acts = state.activities.filter(a => a.deal_id === id);
  openDrawer(esc(d.title), `
    <div class="kv"><span class="k">Stage</span><span class="pill ${d.stage}">${d.stage}</span></div>
    <div class="kv"><span class="k">Value</span><span style="color:var(--green)">${fmt$(d.value)}</span></div>
    <div class="kv"><span class="k">Probability</span><span>${d.probability != null ? d.probability + '%' : '—'}</span></div>
    <div class="kv"><span class="k">Company</span><span>${esc(companyName(d.company_id))}</span></div>
    <div class="kv"><span class="k">Contact</span><span>${esc(personName(d.contact_id))}</span></div>
    <div class="kv"><span class="k">Close date</span><span>${dateFmt(d.close_date)}</span></div>
    ${d.notes ? `<p class="muted" style="margin-top:12px">${esc(d.notes)}</p>` : ''}
    <div class="row" style="margin-top:14px">
      <button class="btn sm ghost" onclick="dealForm('${d.id}')">Edit</button>
      <button class="btn sm ghost" onclick="activityForm({deal_id:'${d.id}',contact_id:'${d.contact_id || ''}'})">Log activity</button>
    </div>
    <h4 style="margin:20px 0 6px">Activity</h4>
    <ul class="timeline">
      ${acts.map(a => `<li><div><span class="pill ${a.type}">${a.type}</span> ${esc(a.subject)}</div><div class="ts">${dateFmt(a.date)}</div></li>`).join('') || '<li class="muted">No activity</li>'}
  `);
}
function dealForm(id) {
  const d = id ? state.deals.find(x => x.id === id) : { stage: 'lead', probability: 0 };
  const popts = state.people.map(c => `<option value="${c.id}" ${c.id === d.contact_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const copts = state.companies.map(c => `<option value="${c.id}" ${c.id === d.company_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  openDrawer(id ? 'Edit deal' : 'New deal', `
    <label>Deal name</label><input id="f_title" value="${esc(d.title)}" />
    <div class="row">
      <div><label>Company</label><select id="f_company"><option value="">—</option>${copts}</select></div>
      <div><label>Contact</label><select id="f_contact"><option value="">—</option>${popts}</select></div>
    </div>
    <div class="row">
      <div><label>Value ($)</label><input id="f_value" type="number" value="${d.value || 0}" /></div>
      <div><label>Stage</label><select id="f_stage">${STAGES.map(s => `<option ${s === d.stage ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div><label>Probability (%)</label><input id="f_prob" type="number" min="0" max="100" value="${d.probability || 0}" /></div>
      <div><label>Close date</label><input id="f_close" type="date" value="${(d.close_date || '').slice(0,10)}" /></div>
    </div>
    <label>Notes</label><textarea id="f_notes" rows="3">${esc(d.notes)}</textarea>
    <button class="btn" style="width:100%;margin-top:16px" onclick="saveDeal('${id || ''}')">Save</button>
    ${id ? `<button class="btn danger" style="width:100%;margin-top:8px" onclick="delRow('crmui_deals','${id}','deals')">Delete</button>` : ''}
  `);
}
async function saveDeal(id) {
  const row = {
    title: val('f_title'), company_id: val('f_company') || null, contact_id: val('f_contact') || null,
    value: Number(val('f_value')) || 0, stage: val('f_stage'), probability: Number(val('f_prob')) || 0,
    close_date: val('f_close') || null, notes: val('f_notes') || null,
  };
  if (!row.title) return alert('Deal name required');
  await upsert('crmui_deals', id, row, 'de'); closeDrawer(); await loadAll(); go(state.route === 'pipeline' ? 'pipeline' : 'deals');
}

// ---------- Activities (crm_activities) ----------
function renderActivities() {
  view().innerHTML = `
    <div class="page-head"><h2>Activities</h2><div class="spacer"></div><button class="btn" onclick="activityForm()">+ Log activity</button></div>
    <div class="panel" style="padding:0">
      <table>
        <thead><tr><th>Type</th><th>Subject</th><th>Contact</th><th>Date</th></tr></thead>
        <tbody>
          ${state.activities.map(a => `<tr onclick="activityForm({id:'${a.id}'})"><td><span class="pill ${a.type}">${a.type}</span></td><td><b>${esc(a.subject)}</b>${a.notes ? `<div class="muted" style="font-size:12px">${esc(a.notes)}</div>` : ''}</td><td class="muted">${esc(personName(a.contact_id))}</td><td class="muted">${dateFmt(a.date)}</td></tr>`).join('') || `<tr><td colspan="4" class="empty">No activities</td></tr>`}
        </tbody>
      </table>
    </div>`;
}
function activityForm(seed = {}) {
  const a = seed.id ? state.activities.find(x => x.id === seed.id) : seed;
  const id = seed.id || '';
  const copts = state.people.map(c => `<option value="${c.id}" ${c.id === a.contact_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const dopts = state.deals.map(d => `<option value="${d.id}" ${d.id === a.deal_id ? 'selected' : ''}>${esc(d.title)}</option>`).join('');
  openDrawer(id ? 'Edit activity' : 'Log activity', `
    <label>Type</label><select id="f_type">${ACT_TYPES.map(t => `<option ${t === a.type ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label>Subject</label><input id="f_subject" value="${esc(a.subject)}" />
    <label>Notes</label><textarea id="f_notes" rows="3">${esc(a.notes)}</textarea>
    <div class="row">
      <div><label>Date</label><input id="f_date" type="date" value="${(a.date || todayISO()).slice(0,10)}" /></div>
      <div><label>Link to deal</label><select id="f_deal"><option value="">—</option>${dopts}</select></div>
    </div>
    <label>Link to contact</label><select id="f_contact"><option value="">—</option>${copts}</select>
    <button class="btn" style="width:100%;margin-top:16px" onclick="saveActivity('${id}')">Save</button>
    ${id ? `<button class="btn danger" style="width:100%;margin-top:8px" onclick="delRow('crmui_activities','${id}','activities')">Delete</button>` : ''}
  `);
}
async function saveActivity(id) {
  const row = {
    type: val('f_type'), subject: val('f_subject'), notes: val('f_notes') || null,
    contact_id: val('f_contact') || null, deal_id: val('f_deal') || null, date: val('f_date') || todayISO(),
  };
  if (!row.subject) return alert('Subject required');
  await upsert('crmui_activities', id, row, 'ac'); closeDrawer(); await loadAll(); go('activities');
}

// ---------- CRUD primitives ----------
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
async function upsert(table, id, row, prefix) {
  let r;
  if (id) {
    r = await sb.from(table).update(row).eq('id', id);
  } else {
    r = await sb.from(table).insert({ ...row, id: newId(prefix), created_at: new Date().toISOString() });
  }
  if (r.error) alert('Save failed: ' + r.error.message);
}
async function delRow(table, id, route) {
  if (!confirm('Delete this record?')) return;
  const r = await sb.from(table).delete().eq('id', id);
  if (r.error) return alert('Delete failed: ' + r.error.message);
  closeDrawer(); await loadAll(); go(route || state.route);
}

// ---------- Drawer ----------
function openDrawer(title, html) {
  document.getElementById('drawerTitle').innerHTML = title;
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ---------- Auto-unlock if verified this session ----------
if (sessionStorage.getItem('crm_ok') === '1') boot();
</script>
</body>
</html>
